name: Build Tikrar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unpack project
        run: |
          rm -rf src && mkdir src
          # Use the most recently committed ZIP, whatever its name is.
          ZIP=""
          NEWEST=0
          while IFS= read -r -d '' f; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            if [ "${T:-0}" -ge "$NEWEST" ]; then NEWEST=${T:-0}; ZIP="$f"; fi
          done < <(find . -maxdepth 2 -iname '*.zip' -not -path './src/*' -print0)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            unzip -q -o "$ZIP" -d src
          else
            echo "No ZIP found, using repository files"
            rsync -a --exclude src --exclude .git ./ src/
          fi
          SETTINGS=$(find src -name settings.gradle.kts -not -path '*/build/*' -not -path '*/__MACOSX/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found. Files in repo:"; ls -la
            echo "Files after unzip:"; find src -maxdepth 3 | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK packages
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk out/Tikrar-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tikrar build ${{ github.run_number }}
          files: out/*.apk
